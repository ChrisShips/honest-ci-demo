[project]
name = "shop"
version = "0.1.0"
description = "The project honest-ci's Python demo verifies."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--deselect tests/test_pricing.py::test_shipping_is_free_from_the_threshold"
